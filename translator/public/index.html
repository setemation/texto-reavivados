<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradutor de Comentários - Ollama</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f5f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #0d47a1; margin-top: 0; }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; background: #e3f2fd; padding: 15px; border-radius: 6px; }
        select, button, input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { background-color: #0d47a1; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1565c0; }
        button:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        .status { margin-bottom: 20px; font-weight: bold; color: #d32f2f; }
        .progress-container { width: 100%; background-color: #e0e0e0; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { height: 24px; background-color: #4caf50; width: 0%; text-align: center; color: white; font-weight: bold; line-height: 24px; transition: width 0.3s; }
        .panels { display: flex; gap: 20px; }
        .panel { flex: 1; display: flex; flexDirection: column; }
        .panel h3 { margin-top: 0; color: #424242; }
        textarea { width: 100%; height: 300px; padding: 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; line-height: 1.5; resize: vertical; box-sizing: border-box; }
        .en-text { background-color: #f9f9f9; color: #616161; }
        .pt-text { background-color: #fff; color: #212121; border-color: #0d47a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tradutor de Comentários Bíblicos (Ollama Local)</h1>
        
        <div class="controls">
            <div>
                <label for="fileSelect">Arquivo:</label>
                <select id="fileSelect">
                    <option value="">Carregando...</option>
                </select>
            </div>
            <div>
                <label for="modelSelect">Modelo Ollama:</label>
                <input type="text" id="modelSelect" value="qwen2.5:14b" placeholder="ex: qwen2.5:14b">
            </div>
            <button id="startBtn">Iniciar Tradução Automática</button>
            <button id="pauseBtn" disabled>Pausar</button>
        </div>

        <div id="statusText" class="status">Aguardando arquivo...</div>
        
        <div class="progress-container">
            <div id="progressBar" class="progress-bar">0%</div>
        </div>

        <div class="panels">
            <div class="panel">
                <h3 id="currentRef">Original (Inglês)</h3>
                <textarea id="enText" class="en-text" readonly></textarea>
            </div>
            <div class="panel">
                <h3>Tradução (Ollama)</h3>
                <textarea id="ptText" class="pt-text" readonly></textarea>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
